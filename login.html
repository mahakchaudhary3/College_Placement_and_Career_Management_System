<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Placement Portal</title><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/auth-pages.css"></head>
<body class="auth-body"><main class="auth-card">
<a class="auth-brand" href="index.html">Placement Portal</a><p class="eyebrow">PLACEMENT & CAREER MANAGEMENT</p><h1>Welcome back</h1><p class="muted">Login to your account.</p>
<form id="loginForm">
<label>Account type</label><div class="role-row"><label><input type="radio" name="role" value="student" checked> Student</label><label><input type="radio" name="role" value="admin"> Admin</label></div>
<label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="username" placeholder="name@example.com" pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$" title="Enter a valid email address">
<label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password">
<p id="formMessage" class="form-message" role="alert"></p><button type="submit">Login</button>
</form><p class="auth-switch">New student? <a href="register.html">Register here</a></p>
</main><script src="js/api.js" defer></script><script src="js/auth.js" defer></script><script src="js/login.js" defer></script></body></html>
