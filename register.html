<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration | Placement Portal</title><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/auth-pages.css"></head>
<body class="auth-body"><main class="auth-card">
<a class="auth-brand" href="index.html">Placement Portal</a><p class="eyebrow">STUDENT REGISTRATION</p><h1>Create your account</h1><p class="muted">Register first, then login with your details.</p>
<form id="registerForm">
<label for="name">Full name</label><input id="name" type="text" required minlength="2" maxlength="60" pattern="[A-Za-z][A-Za-z .'-]{1,59}" title="Use letters, spaces, apostrophes, dots or hyphens">
<label for="email">Email address</label><input id="email" type="email" required autocomplete="email" placeholder="name@example.com" pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$" title="Enter a valid email address">
<label for="course">Course / Department</label><input id="course" type="text" required minlength="2" maxlength="80">
<label for="cgpa">Current CGPA (out of 10)</label><input id="cgpa" type="number" min="0" max="10" step="0.01" required placeholder="e.g. 7.5">
<label for="attendance">Attendance (%)</label><input id="attendance" type="number" min="0" max="100" step="0.1" required placeholder="e.g. 82">
<label for="password">Create password</label><input id="password" type="password" required minlength="8" maxlength="64" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,64}" title="At least 8 characters with uppercase, lowercase and a number">
<label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" required minlength="8" maxlength="64">
<p class="hint">Password: minimum 8 characters, one uppercase, one lowercase and one number.</p>
<p id="formMessage" class="form-message" role="alert"></p><button type="submit">Create Account</button>
</form><p class="auth-switch">Already registered? <a href="login.html">Login</a></p>
</main><script src="js/api.js" defer></script><script src="js/auth.js" defer></script><script src="js/register.js" defer></script></body></html>
